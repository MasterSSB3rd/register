<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableau de bord — Présence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <main class="dash-page">
    <header class="dash-header">
      <div>
        <div class="dash-eyebrow">Gestion de présence</div>
        <h1 class="dash-title">Tableau de bord</h1>
      </div>
      <div style="display: flex; gap: 0.75rem">
        <button class="btn-secondary" id="refresh-btn">Actualiser</button>
        <button class="btn-secondary" id="logout-btn">Déconnexion</button>
      </div>
    </header>

    <section class="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">–</div>
        <div class="stat-label">Total inscrits</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-present" style="color: var(--teal)">–</div>
        <div class="stat-label">Présents</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-absent" style="color: var(--error)">–</div>
        <div class="stat-label">Absents</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-rate" style="color: var(--gold)">–</div>
        <div class="stat-label">Taux de présence</div>
      </div>
    </section>

    <section class="controls">
      <input class="search-input" id="search-input" placeholder="Search by First Name or Family Name..." />
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="present">Present</button>
        <button class="filter-btn" data-filter="absent">Absent</button>
      </div>
    </section>

    <div class="banner-error" id="dash-error" style="display: none"></div>
    <p class="muted" id="loading-text">Chargement…</p>
    <p class="muted" id="empty-text" style="display: none">Aucun étudiant trouvé.</p>

    <div class="table-wrap" id="table-wrap" style="display: none">
      <table>
        <thead>
          <tr>
            <th>First Name</th>
            <th>Family Name</th>
            <th>E-mail</th>
            <th>Niveau</th>
            <th>Filière</th>
            <th>CNE</th>
            <th>Presence</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <div class="student-cards" id="student-cards"></div>
  </main>

  <div class="overlay" id="confirm-overlay">
    <div class="dialog">
      <h2>Confirm attendance</h2>
      <p class="muted" style="margin-top: 0.75rem">
        Student:
        <strong style="color: var(--ink)" id="confirm-name"></strong>
        <br />
        CNE: <strong style="color: var(--ink)" id="confirm-cne"></strong>
      </p>
      <p style="margin-top: 1rem">Are you sure you want to mark this student as present?</p>
      <div style="display: flex; gap: 0.75rem; margin-top: 1.75rem">
        <button class="btn-secondary" id="confirm-cancel">Cancel</button>
        <button class="btn-primary" id="confirm-yes" style="flex: 1">Yes, Mark Present</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin-dashboard.js"></script>
</body>
</html>
