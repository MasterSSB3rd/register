<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace administrateur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  <main class="login-page">
    <form class="login-card" id="login-form">
      <div class="eyebrow-bar" style="background: var(--gold)"></div>
      <h1 style="font-size: 1.5rem; font-weight: 500">Espace administrateur</h1>
      <p class="muted" style="font-size: 0.9rem; margin-top: 0.5rem">
        Connectez-vous pour accéder au tableau de bord de présence.
      </p>

      <label for="username">Nom d'utilisateur</label>
      <input id="username" name="username" autocomplete="username" autofocus />

      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" />

      <div class="banner-error" id="login-error" style="display: none; margin-top: 1.1rem"></div>

      <button type="submit" class="btn-submit" id="login-btn" style="margin-top: 1.75rem">
        Se connecter
      </button>
    </form>
  </main>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/admin-login.js"></script>
</body>
</html>
